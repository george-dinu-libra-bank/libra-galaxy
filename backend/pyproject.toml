[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-backend"
version = "0.1.0"
description = "API-ul FastAPI pentru Libra Galaxy"
requires-python = ">=3.12"
dependencies = [
  "azure-ai-inference>=1.0.0b9",
  "azure-identity>=1.19,<2",
  "email-validator>=2.2,<3",
  "joblib>=1.4,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  # PDF-ul rapoartelor. reportlab si nu weasyprint: weasyprint cere cairo si
  # pango instalate in sistem, ceea ce cade in container.
  "reportlab>=4.2,<6",
  "scikit-learn>=1.5,<2",
  "supabase>=2.18,<3",
  "uvicorn[standard]>=0.35,<1",

  # Verificarea identitatii la inregistrare.
  # Tokenul se valideaza cu cheia publica a proiectului (JWKS), nu cu un secret.
  "pyjwt>=2.10,<3",
  # Upload-ul de poze vine ca multipart/form-data.
  "python-multipart>=0.0.20,<0.1",
  "pillow>=11,<12",
  "pytesseract>=0.3.13,<0.4",
  # DeepFace trage TensorFlow dupa el (sute de MB). E importat lene in
  # app/infrastructure/face_match.py, deci restul aplicatiei porneste si fara
  # el instalat; numai comparatia de fete il cere.
  "deepface>=0.0.93,<0.1",
  "tf-keras>=2.18,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
