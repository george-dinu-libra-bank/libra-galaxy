[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-backend"
version = "0.1.0"
description = "API-ul FastAPI pentru Libra Galaxy"
requires-python = ">=3.12"
dependencies = [
  "azure-ai-inference>=1.0.0b9",
  "azure-identity>=1.19,<2",
  "email-validator>=2.2,<3",
  "joblib>=1.4,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  # PDF-ul rapoartelor. reportlab si nu weasyprint: weasyprint cere cairo si
  # pango instalate in sistem, ceea ce cade in container.
  "reportlab>=4.2,<6",
  "scikit-learn>=1.5,<2",
  "supabase>=2.18,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
