services:
  frontend:
    container_name: libra-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./.env
    environment:
      # watch pe bind mount Windows are nevoie de polling
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Frontend-ul citeste NEXT_PUBLIC_SUPABASE_* (frontend/src/lib/env.ts) —
      # aliasate aici peste cheile canonice din .env, ca valoarea sa nu fie
      # duplicata in fisier. In compose, frontend-ul vorbeste cu backend-ul
      # prin numele serviciului (DNS intern Docker), nu prin localhost.
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true

  backend:
    container_name: libra-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./galaxy-bank-knowledge:/galaxy-bank-knowledge:ro
    env_file:
      - ./.env
    environment:
      - LIBRA_KNOWLEDGE_DIR=/galaxy-bank-knowledge
    stdin_open: true
    tty: true
