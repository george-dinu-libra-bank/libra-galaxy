# Singurul fisier compose al proiectului. Se cheama "docker-compose.yml", iar
# scripturile il dau mereu explicit cu -f, ca sa nu conteze ce nume prefera Docker.
#
# Regula pentru "environment": doar chei cu valoare literala sau ${VAR:-default}.
# NU folosi forma scurta "- NUME" (fara "="): daca variabila lipseste din mediu,
# Compose o pune pe null si STERGE valoarea venita din env_file.
name: libra-galaxy

services:
  frontend:
    container_name: libra-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env
    environment:
      # watch pe bind mount Windows are nevoie de polling
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Codul citeste URL-ul backendului sub trei nume diferite:
      #   BACKEND_INTERNAL_URL -> app/api/health, app/api/backend/[...path]
      #   BACKEND_URL          -> lib/actions/identitate.ts
      #   BACKEND_API_URL      -> lib/data/asistent.ts
      # Toate trei trebuie setate aici: frontend/.env are localhost:8000, care in
      # container ar nimeri chiar frontendul, nu backendul. dev-local.ps1
      # suprascrie cu host.docker.internal, ca sa iasa la backendul de pe masina.
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
      - BACKEND_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
      - BACKEND_API_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    stdin_open: true
    tty: true

  backend:
    container_name: libra-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./galaxy-bank-knowledge:/galaxy-bank-knowledge:ro
    env_file:
      - ./backend/.env
    environment:
      - LIBRA_KNOWLEDGE_DIR=/galaxy-bank-knowledge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
