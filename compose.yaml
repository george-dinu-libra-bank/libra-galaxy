name: libra-galaxy

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      # Implicit: Supabase local. Pentru cloud, completeaza SUPABASE_URL/
      # SUPABASE_ANON_KEY in .env la radacina si porneste cu dev-up-cloud.ps1.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Porneste prin scripts/dev-up.ps1 sau completeaza .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Porneste prin scripts/dev-up.ps1 sau completeaza .env}
    env_file:
      - ./.env
    environment:
      # URL-ul pe care il vede browserul, aliasat peste cheia canonica din .env
      # (frontend/src/lib/env.ts citeste doar formele NEXT_PUBLIC_*).
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Porneste prin scripts/dev-up.ps1 sau completeaza .env}
      # URL-ul pe care il vede containerul; difera de cel de sus doar la Supabase local.
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Completeaza .env}
      BACKEND_INTERNAL_URL: http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
